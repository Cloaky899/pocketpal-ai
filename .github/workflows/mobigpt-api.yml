name: MobiGPT API Chat

on:
  push:
    branches:
      - openai-only-clean
      - manim-agent
      - pocketpal-lite
      - main
  workflow_dispatch:
    inputs:
      build_debug:
        description: Build and upload the unshrunk debug APK
        required: false
        default: false
        type: boolean
      build_arm64_no_r8:
        description: Build a manual ARM64 release diagnostic without R8/resource shrinking
        required: false
        default: false
        type: boolean
      run_emulator_smoke:
        description: Run optional x86_64 Android emulator smoke tests
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: mobigpt-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.21.0
          cache: yarn
      - name: Enable Corepack and Yarn
        run: corepack enable && corepack prepare yarn@1.22.22 --activate
      - name: Install JavaScript dependencies
        run: yarn install --frozen-lockfile --non-interactive
      - name: TypeScript type check
        run: yarn typecheck
      - name: Run ESLint
        run: yarn lint
      - name: Run focused tests
        run: yarn test

  build_release_apks:
    name: Build optimized ${{ matrix.abi }} release APK
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi:
          - arm64-v8a
          - x86_64
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.21.0
          cache: yarn
      - name: Enable Corepack and Yarn
        run: corepack enable && corepack prepare yarn@1.22.22 --activate
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Install JavaScript dependencies
        run: yarn install --frozen-lockfile --non-interactive
      - name: Build optimized release APK
        run: cd android && ./gradlew assembleRelease -PtargetAbi=${{ matrix.abi }} -PreactNativeArchitectures=${{ matrix.abi }}
      - name: Verify APK contains only the requested ABI
        run: |
          actual=$(unzip -Z1 android/app/build/outputs/apk/release/app-release.apk | awk -F/ '$1 == "lib" && NF >= 2 {print $2}' | sort -u)
          printf 'Requested ABI: %s\nPackaged ABI(s):\n%s\n' '${{ matrix.abi }}' "$actual"
          test "$actual" = '${{ matrix.abi }}'
      - name: Rename APK and generate checksum
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/release/app-release.apk output/MobiGPT-api-release-${{ matrix.abi }}.apk
          sha256sum output/MobiGPT-api-release-${{ matrix.abi }}.apk | tee output/MobiGPT-api-release-${{ matrix.abi }}.apk.sha256
      - name: Upload optimized release APK
        uses: actions/upload-artifact@v7
        with:
          name: MobiGPT-api-release-${{ matrix.abi }}
          path: output/
          if-no-files-found: error
          retention-days: 14

  build_release_aab:
    name: Build optimized release AAB
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.21.0
          cache: yarn
      - name: Enable Corepack and Yarn
        run: corepack enable && corepack prepare yarn@1.22.22 --activate
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Install JavaScript dependencies
        run: yarn install --frozen-lockfile --non-interactive
      - name: Build optimized release AAB
        run: cd android && ./gradlew bundleRelease
      - name: Rename AAB and generate checksum
        run: |
          mkdir -p output
          cp android/app/build/outputs/bundle/release/app-release.aab output/MobiGPT-api-release.aab
          sha256sum output/MobiGPT-api-release.aab | tee output/MobiGPT-api-release.aab.sha256
      - name: Upload release AAB
        uses: actions/upload-artifact@v7
        with:
          name: MobiGPT-api-release-aab
          path: output/
          if-no-files-found: error
          retention-days: 14

  smoke_test:
    name: Optional smoke-test x86_64 release APK
    if: github.event_name == 'workflow_dispatch' && inputs.run_emulator_smoke == true
    needs: build_release_apks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Download x86_64 release APK
        uses: actions/download-artifact@v8
        with:
          name: MobiGPT-api-release-x86_64
          path: release
      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Set up Android SDK for emulator diagnostics
        uses: android-actions/setup-android@v4
      - name: Provision emulator package explicitly
        run: sdkmanager --install 'emulator' 'platform-tools'
      - name: Install and launch release APK in emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 900
          disable-animations: false
          script: |
            adb install -r release/MobiGPT-api-release-x86_64.apk && adb shell am force-stop com.pocketpallite && adb logcat -c && adb shell am start -W -n com.pocketpallite/com.pocketpal.MainActivity | grep -q 'Status: ok' && sleep 8 && (adb shell pidof com.pocketpallite || adb shell dumpsys activity top | grep -q 'com.pocketpallite/com.pocketpal.MainActivity') || (adb logcat -d -t 500 && exit 1)

  smoke_test_android8:
    name: Optional smoke-test release APK on Android 8.1
    if: github.event_name == 'workflow_dispatch' && inputs.run_emulator_smoke == true
    needs: build_release_apks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Download x86_64 release APK
        uses: actions/download-artifact@v8
        with:
          name: MobiGPT-api-release-x86_64
          path: release
      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Set up Android SDK for emulator diagnostics
        uses: android-actions/setup-android@v4
      - name: Provision emulator package explicitly
        run: sdkmanager --install 'emulator' 'platform-tools'
      - name: Install and launch release APK on Android 8.1
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 27
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 900
          disable-animations: false
          script: |
            adb install -r release/MobiGPT-api-release-x86_64.apk && adb shell am force-stop com.pocketpallite && adb logcat -c && adb shell am start -W -n com.pocketpallite/com.pocketpal.MainActivity | grep -q 'Status: ok' && sleep 8 && (adb shell pidof com.pocketpallite || adb shell dumpsys activity top | grep -q 'com.pocketpallite/com.pocketpal.MainActivity') || (adb logcat -d -t 500 && exit 1)

  build_arm64_no_r8:
    name: Build manual ARM64 release diagnostic without R8
    if: github.event_name == 'workflow_dispatch' && inputs.build_arm64_no_r8 == true
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.21.0
          cache: yarn
      - name: Enable Corepack and Yarn
        run: corepack enable && corepack prepare yarn@1.22.22 --activate
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Install JavaScript dependencies
        run: yarn install --frozen-lockfile --non-interactive
      - name: Build ARM64 release without shrinking
        run: cd android && ./gradlew assembleRelease -PtargetAbi=arm64-v8a -PreactNativeArchitectures=arm64-v8a -PdisableReleaseShrinking=true
      - name: Rename diagnostic APK and generate checksum
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/release/app-release.apk output/MobiGPT-api-diagnostic-arm64-no-r8.apk
          sha256sum output/MobiGPT-api-diagnostic-arm64-no-r8.apk | tee output/MobiGPT-api-diagnostic-arm64-no-r8.apk.sha256
      - name: Upload diagnostic APK
        uses: actions/upload-artifact@v7
        with:
          name: MobiGPT-api-diagnostic-arm64-no-r8
          path: output/
          if-no-files-found: error
          retention-days: 14

  build_debug:
    name: Build manual debug APK
    if: github.event_name == 'workflow_dispatch' && inputs.build_debug == true
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.21.0
          cache: yarn
      - name: Enable Corepack and Yarn
        run: corepack enable && corepack prepare yarn@1.22.22 --activate
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Install JavaScript dependencies
        run: yarn install --frozen-lockfile --non-interactive
      - name: Build unshrunk debug APK
        run: cd android && ./gradlew assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: MobiGPT-api-debug-universal
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
