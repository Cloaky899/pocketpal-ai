name: Manim Generation

on:
  push:
    branches:
      - manim-agent
      - main
      - pocketpal-lite
  pull_request:
    paths:
      - 'renderer/**'
      - 'src/visualization/**'
      - '__tests__/**'
      - '.github/workflows/manim-generation.yml'
  workflow_dispatch:
    inputs:
      live_provider:
        description: Run the live OpenAI-compatible provider smoke test
        required: false
        default: false
        type: boolean
      model:
        description: Model identifier for the live provider smoke test
        required: false
        default: gpt-oss-120b
        type: string

permissions:
  contents: read

concurrency:
  group: manim-generation-${{ github.ref }}
  cancel-in-progress: true

env:
  MANIM_IMAGE: manimcommunity/manim:v0.19.1
  REGOLO_BASE_URL: https://api.regolo.ai/v1
  GENERATION_MODEL: ${{ inputs.model || 'gpt-oss-120b' }}

jobs:
  manim_deterministic:
    name: Deterministic Manim policy and render tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Pull pinned Manim Community image
        run: docker pull "$MANIM_IMAGE"
      - name: Run Python policy tests
        run: |
          docker run --rm \
            --entrypoint python \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e PYTHONPATH=/workspace/renderer \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            "$MANIM_IMAGE" \
            -m unittest discover -s renderer/tests -p 'test_*.py' -v
      - name: Render deterministic Manim fixture
        run: |
          rm -rf renderer/tests/output
          docker run --rm \
            --entrypoint manim \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            "$MANIM_IMAGE" \
            -ql --disable_caching --media_dir renderer/tests/output renderer/tests/fixtures/smoke_scene.py SmokeScene
          video=$(find renderer/tests/output -type f -name 'SmokeScene.mp4' | head -n 1)
          test -n "$video"
          test -s "$video"
          mkdir -p renderer/tests/output/diagnostics
          docker run --rm \
            --entrypoint ffmpeg \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            "$MANIM_IMAGE" \
            -y -sseof -1 -i "${video#/workspace/}" -frames:v 1 renderer/tests/output/diagnostics/smoke-frame.png
          test -s renderer/tests/output/diagnostics/smoke-frame.png
      - name: Upload safe deterministic artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: manim-deterministic-diagnostics
          path: renderer/tests/output/diagnostics/
          if-no-files-found: ignore
          retention-days: 7

  javascript_contract:
    name: JavaScript visualization contract checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.21.0
          cache: yarn
      - name: Enable Corepack and install dependencies
        run: corepack enable && corepack prepare yarn@1.22.22 --activate && yarn install --frozen-lockfile --non-interactive
      - name: Run JavaScript contract checks
        run: yarn typecheck && yarn lint && yarn test --runInBand

  live_provider:
    name: Opt-in live OpenAI-compatible generation smoke test
    if: github.event_name == 'workflow_dispatch' && inputs.live_provider == true
    needs: [manim_deterministic, javascript_contract]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Pull pinned Manim Community image
        run: docker pull "$MANIM_IMAGE"
      - name: Check provider secret availability
        id: secret_check
        env:
          REGOLO_API_KEY: ${{ secrets.REGOLO_API_KEY }}
        run: |
          if [ -z "$REGOLO_API_KEY" ]; then
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'REGOLO_API_KEY is not configured; live provider test is skipped.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'available=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Run live prompt-to-Manim smoke test
        if: steps.secret_check.outputs.available == 'true'
        env:
          REGOLO_API_KEY: ${{ secrets.REGOLO_API_KEY }}
        run: |
          docker run --rm \
            --entrypoint python \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e PYTHONPATH=/workspace/renderer \
            -e GENERATION_API_BASE="$REGOLO_BASE_URL" \
            -e GENERATION_API_KEY="$REGOLO_API_KEY" \
            -e GENERATION_MODEL="$GENERATION_MODEL" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            "$MANIM_IMAGE" \
            renderer/scripts/live_generation_smoke.py
      - name: Record live-test status
        if: always()
        run: |
          if [ '${{ steps.secret_check.outputs.available }}' = 'true' ]; then
            echo 'Live provider smoke test completed for the configured model.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Live provider smoke test skipped because REGOLO_API_KEY is unavailable.' >> "$GITHUB_STEP_SUMMARY"
          fi
